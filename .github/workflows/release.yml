name: Release

on:
  push:
    tags:
      - "v*"
    # A dry run when the workflow itself changes on a branch: builds and checks, publishes nothing.
    # (Path filters do not apply to tag pushes.)
    branches:
      - "**"
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dry-run' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # check runs checkClasses on the release jar and compiles commonMain on its own before publishing
      - name: Build and check the release jars
        run: ./gradlew check compileCommonMainKotlinMetadata release -Pversion="${VERSION#v}" --console=plain

      - name: Write checksums
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: build/release
        run: sha256sum *.jar > SHA256SUMS

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/release/*.jar build/release/SHA256SUMS \
            --title "$GITHUB_REF_NAME" --generate-notes
