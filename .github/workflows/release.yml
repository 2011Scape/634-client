name: Release

on:
  push:
    tags:
      - "v*"
    # A dry run when the workflow itself changes on a branch: builds and checks, publishes nothing.
    # (Path filters do not apply to tag pushes.)
    branches:
      - "**"
    paths:
      - ".github/workflows/release.yml"

# The build runs with a read-only token; only the publish job, which runs no project code, can write.
# Actions are pinned to commits (the release in the comment), so a moved tag cannot change what runs.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dry-run' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          validate-wrappers: true

      # check runs checkClasses on the release jar and compiles commonMain on its own before publishing
      - name: Build and check the release jars
        run: ./gradlew check compileCommonMainKotlinMetadata release -Pversion="${VERSION#v}" --console=plain

      # on a dry run too, so the run shows what a release would publish
      - name: Write checksums
        working-directory: build/release
        run: |
          sha256sum *.jar *.zip > SHA256SUMS
          ls -l
          cat SHA256SUMS

      - name: Keep the release files for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            build/release/*.jar
            build/release/*.zip
            build/release/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release
          path: release

      - name: Check the checksums
        working-directory: release
        run: sha256sum -c SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.jar release/*.zip release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
