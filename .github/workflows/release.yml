name: Release

# Two release channels:
#   Stable       a tag vX.Y.Z publishes a release of that name; GitHub's "latest" is the newest of them.
#   Development  every push to main rebuilds the one pre-release tagged "dev" (the tag moved to the
#                commit, the release made again with the new files), versioned dev-<yyyymmdd>-<sha>.
# A pull request that touches this file is a dry run: it builds and checks a development build and
# publishes nothing. (Path filters do not apply to tag pushes.)
on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
    paths:
      - ".github/workflows/release.yml"

# The build runs with a read-only token; only the publish job, which runs no project code, can write.
# Actions are pinned to commits (the release in the comment), so a moved tag cannot change what runs.
permissions:
  contents: read

# one development publish at a time, in order: two pushes to main must not race over the dev tag
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the whole history and the tags: the development notes list the commits since the last stable tag
          fetch-depth: 0
          fetch-tags: true

      - name: Name the build
        id: version
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "$REF" == refs/tags/v* ]]; then
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "channel=development" >> "$GITHUB_OUTPUT"
            echo "version=dev-$(date -u +%Y%m%d)-${SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          validate-wrappers: true

      # check runs checkClasses on the release jar and compiles commonMain on its own before publishing.
      # Two workers: the JVM, JS, metadata and test compiles share one Kotlin daemon (3 GB), and three or
      # more at once fill its heap and stall the build in garbage collection.
      - name: Build and check the release jars
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew check compileCommonMainKotlinMetadata release -Pversion="$VERSION" --console=plain --max-workers=2

      # on a dry run too, so the run shows what a release would publish
      - name: Write checksums
        working-directory: build/release
        run: |
          sha256sum *.jar *.zip > SHA256SUMS
          ls -l
          cat SHA256SUMS

      # the development build's notes: where it comes from and the merges since the last stable release
      # (a stable release gets GitHub's generated notes instead)
      - name: Write the development notes
        if: steps.version.outputs.channel == 'development'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          {
            echo "Development build \`$VERSION\` from \`main\` at ${SHA::7}, built $(date -u +'%Y-%m-%d %H:%M UTC')."
            echo
            echo "This pre-release is replaced by every push to main. The [latest stable release](https://github.com/$REPOSITORY/releases/latest) is the one to keep."
            echo
            if [ -n "$last" ]; then
              echo "### Since $last"
              echo
              git log --first-parent --format='- %s (%h)' "$last..HEAD"
            fi
          } > build/release/NOTES.md
          cat build/release/NOTES.md

      - name: Keep the release files for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            build/release/*.jar
            build/release/*.zip
            build/release/SHA256SUMS
            build/release/NOTES.md
          if-no-files-found: error

  publish:
    needs: release
    # a stable tag, or a push to main; never a pull request's dry run
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      CHANNEL: ${{ needs.release.outputs.channel }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release
          path: release

      - name: Check the checksums
        working-directory: release
        run: sha256sum -c SHA256SUMS

      - name: Publish the stable release
        if: env.CHANNEL == 'stable'
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.jar release/*.zip release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

      # the dev tag is moved to this commit, the old pre-release removed (its files carry the old name)
      # and a new one made from it: the page https://github.com/<repo>/releases/tag/dev stays the same
      - name: Publish the development build
        if: env.CHANNEL == 'development'
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/dev" -f sha="$GITHUB_SHA" -F force=true \
            || gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/dev" -f sha="$GITHUB_SHA"
          gh release delete dev --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create dev release/*.jar release/*.zip release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --prerelease --title "Development build $VERSION" \
            --notes-file release/NOTES.md
