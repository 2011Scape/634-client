name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # check runs checkClasses on the release jar before it is published
      - name: Build and check the release jars
        run: ./gradlew check release -Pversion="${GITHUB_REF_NAME#v}" --console=plain

      - name: Check that commonMain is common
        run: ./gradlew compileCommonMainKotlinMetadata -PcommonCheck=true --console=plain

      - name: Write checksums
        working-directory: build/release
        run: sha256sum *.jar > SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/release/*.jar build/release/SHA256SUMS \
            --title "$GITHUB_REF_NAME" --generate-notes
