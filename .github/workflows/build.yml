name: Build

on:
  push:
  pull_request:

# Actions are pinned to commits (the release in the comment), so a moved tag cannot change what runs.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 21 builds (the toolchain) and is the default; 25 is the newest JDK the client runs on, for checkClasses
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            25
            21

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          validate-wrappers: true

      # Both targets: the JVM client and checks, commonMain compiled against the common standard
      # library alone (compileCommonMainKotlinMetadata), and the browser bundle
      - name: Compile, package and check
        run: ./gradlew build releaseJar --console=plain

      # Every class loads and verifies from the release jar, and no new method is over the JIT limit
      # (src/ci/java/CheckClasses), on the newest supported JDK as well
      - name: Check the classes on Java 25
        run: ./gradlew checkClasses -PcheckClasses.java=25 -Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64 --console=plain

      - name: Upload the release jar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runetek5-634-${{ github.sha }}
          path: build/release/*.jar
          if-no-files-found: error

      - name: Upload the browser bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runetek5-634-browser-${{ github.sha }}
          path: build/dist/js/productionExecutable
          if-no-files-found: error
