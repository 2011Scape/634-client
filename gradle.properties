org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=true
# The Kotlin compiler needs more than its default heap for the client's 1100-odd files: with the
# default, a fresh Kotlin daemon (as on CI) fails with "GC overhead limit exceeded".
org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC
kotlin.daemon.jvmargs=-Xmx3g -XX:+UseParallelGC
